<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Pay period overview mock screenshot</title>
  <desc id="desc">A sanitized calendar-style overview of a 26th to 25th pay period with work days, holidays, and skipped weekends.</desc>
