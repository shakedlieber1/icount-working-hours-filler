<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Terminal approval flow mock screenshot</title>
  <desc id="desc">A sanitized terminal preview showing the monthly iCount working-hours filler asking for user approval before saving each day.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#263238"/>
      <stop offset="1" stop-color="#102027"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1f2933" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1040" height="620" fill="#eef4f2"/>
  <rect x="70" y="64" width="900" height="492" rx="14" fill="#111827" filter="url(#shadow)"/>
  <rect x="70" y="64" width="900" height="46" rx="14" fill="url(#header)"/>
  <rect x="70" y="96" width="900" height="14" fill="#102027"/>
  <circle cx="101" cy="88" r="7" fill="#ff5f56"/>
  <circle cx="125" cy="88" r="7" fill="#ffbd2e"/>
  <circle cx="149" cy="88" r="7" fill="#27c93f"/>
  <text x="520" y="93" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#d8e2dc">icount-working-hours-filler</text>
  <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22">
    <text x="112" y="156" fill="#a7f3d0">$ .venv/bin/python main.py 2026-06</text>
    <text x="112" y="206" fill="#e5e7eb">Pay period: 2026-05-26 .. 2026-06-25</text>
    <text x="112" y="246" fill="#e5e7eb">Work days to fill (Sun-Thu): 22</text>
    <text x="112" y="286" fill="#93c5fd">  of which holidays: 1, erev (half day): 1</text>
    <text x="112" y="346" fill="#fef3c7">[3/22] 2026-05-27 (Wed)  WORK</text>
    <text x="112" y="388" fill="#e5e7eb">  hours: 08:42 - 18:18  (9.60h)</text>
    <text x="112" y="430" fill="#f9fafb">  Review in the browser.</text>
    <text x="112" y="472" fill="#a7f3d0">  [Enter]=submit, [s]=skip, [q]=quit:</text>
    <rect x="112" y="500" width="14" height="28" fill="#d1fae5">
      <animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
